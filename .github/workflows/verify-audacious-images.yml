name: Verify Audacious Images

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Render live homepage
        shell: bash
        run: |
          set -e
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1800 --screenshot=audacious-verify.png https://www.audacious.com/
      - uses: actions/upload-artifact@v4
        with:
          name: audacious-verify
          path: audacious-verify.png
