name: Inspect Audacious Images

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Build contact sheet
        shell: bash
        run: |
          set -e
          mkdir -p imgs
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQG0vnlFNOK8WQ/feedshare-shrink_800/B4EZuSV3GYKkAg-/0/1767686763702?e=2147483647&v=beta&t=LJKy9aEgKgt1znBt-8f_nps4--vQ9iEcNZGFOc7oz_U' -o imgs/01-frank.jpg
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E10AQEpwtO3BbNTxg/image-shrink_800/B4EZ4XLTysHcAg-/0/1778505301450?e=2147483647&v=beta&t=PVkuyyVSJy0vdIZeWVQXpwREoKPJypBXluLxkoOE2j4' -o imgs/02-plaatwerk.jpg
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQFI3zNfX1jXpQ/feedshare-shrink_800/B4EZxGh0EGJYAg-/0/1770709795427?e=2147483647&v=beta&t=48RtNUXpG-1c2uYmPxS-34qcAmHr3cipYdW1M68N4gI' -o imgs/03-sheetmetal.jpg
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQGbMx01IKWFTg/feedshare-shrink_800/B4EZwPSFa_GcAg-/0/1769782925446?e=2147483647&v=beta&t=NpqXX0QwAWEGJ7p_3K2T2UwPXAqOimz4TyFSsGZy1DY' -o imgs/04-plaatwerk.jpg
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQFbKAY-CHOVyg/feedshare-shrink_800/B4EZ5Qo9K3GUAc-/0/1779469374540?e=2147483647&v=beta&t=kNINehOSbPYbiWHeczxRFnVgyRfhCQb4-aDxrd5TQl0' -o imgs/05-wim.jpg
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQFQ0oA9WMZb6Q/feedshare-shrink_800/B4EaAWWoC5JEAc-/0/1787081425508?e=2147483647&v=beta&t=e8xdBVZeFGnuyaVfD7yyOJZG0THTOe7yWh9MFYEm9A8' -o imgs/06-airco.jpg
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E10AQEIlet322VCaw/image-shrink_800/B4EZ25_.RuJEAg-/0/1776942048774?e=2147483647&v=beta&t=unuABcw5kFazrRFzSoFJCFNddokwg4a-UtzS8Nqo55Y' -o imgs/07-techniek.jpg
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQG0jiU9dE5ktw/feedshare-image-high-res/B4EZ9bcgLUHoAc-/0/1783945626660?e=2147483647&v=beta&t=WA1u3UF1lSeNY0dX253lub-j1VE4vG0vRM1NfML5Xqw' -o imgs/08-website.jpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for f in imgs/*.jpg; do
            convert "$f" -resize '500x360^' -gravity center -extent 500x360 -background white -gravity south -splice 0x40 -fill black -pointsize 20 -annotate +0+8 "$(basename "$f")" "$f.tmp.png"
          done
          montage imgs/*.tmp.png -tile 2x -geometry +12+12 contact-sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: audacious-contact-sheet
          path: contact-sheet.png
