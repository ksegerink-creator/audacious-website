name: Find Audacious Public Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Find LinkedIn post URLs and images
        shell: bash
        run: |
          set -u
          curl -L -sS -A 'Mozilla/5.0' 'https://nl.linkedin.com/company/audacious-sheet-metal-services-bv' -o /tmp/company.html
          grep -Eo 'https://nl\.linkedin\.com/posts/audacious-sheet-metal-services-bv_[^"<> ]+' /tmp/company.html | sed 's/&amp;/\&/g' | sort -u | head -20 | tee /tmp/posts.txt || true
          n=0
          while IFS= read -r url; do
            n=$((n+1))
            [ $n -gt 12 ] && break
            echo "=== POST $n ==="
            echo "$url"
            curl -L -sS -A 'Mozilla/5.0' "$url" -o /tmp/post.html
            grep -Eio '<meta[^>]+(property|name)="(og:image|twitter:image)"[^>]+>' /tmp/post.html | head -4 || true
          done < /tmp/posts.txt
