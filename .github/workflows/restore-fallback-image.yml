name: Restore Audacious Fallback Image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download valid Audacious production photo
        shell: bash
        run: |
          set -e
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E10AQEIlet322VCaw/image-shrink_800/B4EZ25_.RuJEAg-/0/1776942048774?e=2147483647&v=beta&t=unuABcw5kFazrRFzSoFJCFNddokwg4a-UtzS8Nqo55Y' -o assets/hero-press-brake.jpeg
          file assets/hero-press-brake.jpeg
          test -s assets/hero-press-brake.jpeg
      - name: Commit repaired image
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-press-brake.jpeg
          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi
          git commit -m "Replace broken fallback image [skip ci]"
          git push
