name: Inspect Current Audacious Photos

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build contact sheet
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p /tmp/sheet
          for f in assets/audacious/*.jpg; do
            name="$(basename "$f")"
            convert "$f" -resize '520x360^' -gravity center -extent 520x360 -background white -gravity south -splice 0x46 -fill black -pointsize 20 -annotate +0+10 "$name" "/tmp/sheet/$name.png"
          done
          montage /tmp/sheet/*.png -tile 2x -geometry +12+12 audacious-contact-sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: audacious-current-photos
          path: audacious-contact-sheet.png
