name: Restore Audacious Local Photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Audacious photos
        shell: bash
        run: |
          set -e
          mkdir -p assets/audacious
          curl -L -sS --fail 'https://www.metaalnieuws.nl/wp-content/uploads/2023/11/aud1.jpg' -o 'assets/audacious/kanten.jpg'
          curl -L -sS --fail 'https://www.metaalnieuws.nl/wp-content/uploads/2023/11/aud2.jpg' -o 'assets/audacious/graveren.jpg'
          curl -L -sS --fail 'https://www.metaalnieuws.nl/wp-content/uploads/2023/11/aud3.jpg' -o 'assets/audacious/lasersnijden.jpg'
          curl -L -sS --fail 'https://www.metaalnieuws.nl/wp-content/uploads/2023/11/aud4.jpg' -o 'assets/audacious/productiehal.jpg'
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E10AQEIlet322VCaw/image-shrink_800/B4EZ25_.RuJEAg-/0/1776942048774?e=2147483647&v=beta&t=unuABcw5kFazrRFzSoFJCFNddokwg4a-UtzS8Nqo55Y' -o 'assets/audacious/lassen.jpg'
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQFQ0oA9WMZb6Q/feedshare-shrink_800/B4EaAWWoC5JEAc-/0/1787081425508?e=2147483647&v=beta&t=e8xdBVZeFGnuyaVfD7yyOJZG0THTOe7yWh9MFYEm9A8' -o 'assets/audacious/stikstof.jpg'
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQFI3zNfX1jXpQ/feedshare-shrink_800/B4EZxGh0EGJYAg-/0/1770709795427?e=2147483647&v=beta&t=48RtNUXpG-1c2uYmPxS-34qcAmHr3cipYdW1M68N4gI' -o 'assets/audacious/vrachtwagen.jpg'
          curl -L -sS --fail 'https://media.licdn.com/dms/image/v2/D4E22AQGbMx01IKWFTg/feedshare-shrink_800/B4EZwPSFa_GcAg-/0/1769782925446?e=2147483647&v=beta&t=NpqXX0QwAWEGJ7p_3K2T2UwPXAqOimz4TyFSsGZy1DY' -o 'assets/audacious/bus.jpg'
          file assets/audacious/*
          test -s assets/audacious/kanten.jpg
          test -s assets/audacious/productiehal.jpg
      - name: Commit local photos
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audacious
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Restore Audacious local photos [skip ci]"
          git push
