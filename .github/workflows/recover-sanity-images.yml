name: Recover Sanity Images

on:
  push:
    branches: [main]

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Query Wayback for Sanity assets
        shell: bash
        run: |
          set -u
          echo "=== SANITY CDN CAPTURES ==="
          curl -L -sS --get 'https://web.archive.org/cdx/search/cdx'             --data-urlencode 'url=cdn.sanity.io/images/wehjzlhm/production/*'             --data-urlencode 'output=json'             --data-urlencode 'filter=statuscode:200'             --data-urlencode 'filter=mimetype:image/*'             --data-urlencode 'collapse=urlkey'             --data-urlencode 'from=2026'             --data-urlencode 'to=2026' | head -c 60000
          echo
          echo "=== AUDACIOUS ASSET CAPTURES ==="
          curl -L -sS --get 'https://web.archive.org/cdx/search/cdx'             --data-urlencode 'url=www.audacious.com/wp-content/uploads/*'             --data-urlencode 'output=json'             --data-urlencode 'filter=statuscode:200'             --data-urlencode 'collapse=urlkey'             --data-urlencode 'from=2020'             --data-urlencode 'to=2026' | head -c 60000
