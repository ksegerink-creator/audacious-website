name: Diagnose Sanity Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live asset paths
        shell: bash
        run: |
          set -u
          echo "=== HOMEPAGE ==="
          curl -sS -o /tmp/home.html -w "HTTP %{http_code} content-type=%{content_type}\n" https://www.audacious.com/
          echo "=== HERO IMAGE ==="
          curl -sS -o /tmp/hero.jpg -w "HTTP %{http_code} size=%{size_download} content-type=%{content_type}\n" https://www.audacious.com/assets/hero-press-brake.jpeg
          file /tmp/hero.jpg || true
          echo "=== HERO CSS ==="
          curl -sS -o /tmp/hero.css -w "HTTP %{http_code} size=%{size_download} content-type=%{content_type}\n" https://www.audacious.com/css/hero-header.css
          grep -n "hero-press-brake" /tmp/hero.css || true
          echo "=== MAIN JS ==="
          curl -sS -o /tmp/main.js -w "HTTP %{http_code} size=%{size_download} content-type=%{content_type}\n" https://www.audacious.com/js/main.js
          grep -n "hero-press-brake" /tmp/main.js | head || true

      - name: Query Sanity image data
        shell: bash
        run: |
          set -u
          QUERY='{"home": *[_type == "homePage"][0]{"heroImageUrl": hero.image.asset->url,"heroVideoFileUrl": hero.videoFile.asset->url,"heroVideoUrl": hero.videoUrl,"services": featuredServices[]->{title,"imageUrl": coalesce(hero.image.asset->url, heroImage.asset->url)},"markets": featuredMarkets[]->{title,"imageUrl": image.asset->url},"products": featuredProductGroups[]->{title,"imageUrl": image.asset->url},"projectCards": projectCards[]{title,"imageUrl": link.internalPage->hero.image.asset->url}},"pageImages": *[_type == "page" && defined(hero.image.asset)]{title,"slug":slug.current,"imageUrl":hero.image.asset->url}[0...20]}'
          curl -sS --get \
            -w "\nHTTP %{http_code}\n" \
            'https://wehjzlhm.api.sanity.io/v2025-02-19/data/query/production' \
            --data-urlencode "query=$QUERY"
